# Seed taxonomy v0.1 - a starting point, NOT final.
# Plan: label the first ~30 ads, add whatever is missing, merge duplicates,
# then freeze v1.0 after ~50 ads and log every change in CHANGELOG.md.
# aliases are matched case-insensitively on word boundaries.
# Ambiguous aliases (r, go, c, sas, excel) need context rules - see schema.md.

